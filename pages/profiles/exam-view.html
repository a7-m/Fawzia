<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداء الاختبار | Fawzia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="main-nav" aria-label="شريط التنقل">
        <div class="nav-brand">
            <a class="nav-logo" href="../../index.html#homePage">
                <span class="brand-mark" aria-hidden="true">﴾﴿</span>
                <span class="brand-text">اختبارات تعليمية</span>
            </a>
        </div>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navLinks">
            <span class="sr-only">تبديل قائمة التنقل</span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>
        <ul id="navLinks" class="nav-links">
            <li class="nav-item">
                <a class="nav-link" href="../../index.html#homePage">
                    <span class="nav-icon" aria-hidden="true">🏠</span>
                    <span class="nav-label">الرئيسية</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../about.html">
                    <span class="nav-icon" aria-hidden="true">ℹ️</span>
                    <span class="nav-label">عن المنصة</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../auth/login.html" id="profileLink">
                    <span class="nav-icon" aria-hidden="true">🙍🏻‍♂️</span>
                    <span class="nav-label">الملف الشخصي</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../login.html">
                    <span class="nav-icon" aria-hidden="true">🔐</span>
                    <span class="nav-label">تسجيل الدخول</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="history.back(); return false;">
                    <span class="nav-icon" aria-hidden="true">↩️</span>
                    <span class="nav-label">رجوع</span>
                </a>
            </li>
        </ul>
        <div class="theme-toggle-container">
            <button id="themeToggle" class="theme-toggle-btn" title="تبديل الثيم">
                <span class="theme-icon">🌓</span>
            </button>
        </div>
    </nav>

    <main class="flex-grow">
        <div class="container page-container active-container">
            <section class="page active" data-page="test">
                <div id="statusMessage" class="hidden"></div>
                <div id="actionButtons" class="btn-group"></div>

                <div id="examContainer" class="hidden">
                    <header class="page-header">
                        <h1 id="examTitle"></h1>
                        <p id="examSubject" class="page-subtitle"></p>
                        <p id="examDuration" class="page-meta"></p>
                        <p id="examVisibility" class="page-meta"></p>
                        <p id="examCreatedAt" class="page-meta"></p>
                        <p id="questionsCount" class="page-meta"></p>
                        <span id="modeBadge" class="status-badge"></span>
                    </header>

                    <div id="previewHint" class="hidden info-card">
                        ⚠️ أنت في وضع المعاينة. الإجابات لن يتم حفظها.
                    </div>

                    <div class="timer">
                        الوقت المتبقي: <span id="timerDisplay">--:--</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <p id="progressText" class="question-progress"></p>

                    <div class="card-surface">
                        <p class="question-number">نص القرائية</p>
                        <div id="examPassage"></div>
                    </div>

                    <div class="question-container">
                        <div class="question-header">
                            <div class="question-number" id="questionNumber"></div>
                            <div class="question-text" id="questionText"></div>
                        </div>
                        <div id="optionsContainer" class="options-container"></div>
                        <div id="answerNote" class="answer-status">
                            <p>✓ تم حفظ إجابتك</p>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button id="prevQuestionBtn" class="btn btn-secondary" disabled>السابق</button>
                        <button id="nextQuestionBtn" class="btn">التالي</button>
                        <button id="submitExamBtn" class="btn">إنهاء الاختبار وتسليم الإجابة</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="../../js/exam-view.js"></script>
    <script type="module" src="../../js/script.js"></script>
</body>
</html>

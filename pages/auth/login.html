<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | مدرسة Fawzia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/style.css" />
    <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
  </head>
  <body class="min-h-screen flex flex-col bg-[--background] text-[--text]">
    <nav class="main-nav" aria-label="شريط التنقل">
      <div class="nav-brand">
        <a class="nav-logo" href="../../index.html">
          <span class="brand-mark" aria-hidden="true">﴾﴿</span>
          <span class="brand-text">اختبارات تعليمية</span>
        </a>
      </div>
      <ul class="nav-links">
        <li class="nav-item"><a class="nav-link" href="../../index.html">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" href="../about.html">عن المنصة</a></li>
        <li class="nav-item"><a class="nav-link" id="profileLink" href="./login.html">الملف الشخصي</a></li>
        <li class="nav-item"><a class="nav-link" href="./login.html">تسجيل الدخول</a></li>
      </ul>
      <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle-btn" title="تبديل الثيم"><span class="theme-icon">🌓</span></button>
      </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6">
      <section class="w-full max-w-md bg-[--surface] shadow-lg rounded-2xl p-8 mx-4">
        <h1 class="text-2xl font-bold mb-6 text-center">تسجيل الدخول</h1>
        <div id="statusMessage" class="hidden mb-4 px-4 py-3 rounded-xl text-sm font-semibold"></div>
        <form id="loginForm" class="space-y-4">
          <div class="flex flex-col gap-2">
            <label for="loginEmail" class="font-semibold">البريد الإلكتروني</label>
            <input id="loginEmail" type="email" required placeholder="student@example.com" class="form-group input" />
          </div>
          <div class="flex flex-col gap-2">
            <label for="loginPassword" class="font-semibold">كلمة المرور</label>
            <input id="loginPassword" type="password" required placeholder="••••••••" class="form-group input" />
          </div>
          <button type="submit" class="btn w-full">تسجيل الدخول</button>
        </form>

        <div class="my-4 flex items-center justify-center gap-2">
          <span class="flex-1 h-px bg-gray-300"></span>
          <span class="text-sm text-gray-500">أو</span>
          <span class="flex-1 h-px bg-gray-300"></span>
        </div>
        <button id="googleLogin" class="btn btn-secondary w-full flex items-center justify-center gap-2">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5" />
          تسجيل الدخول باستخدام Google
        </button>

        <div class="text-center mt-6 space-y-2">
          <a href="../forgot.html" class="text-sm text-[--primary] hover:underline">نسيت كلمة السر؟</a>
        </div>
        <div class="text-center mt-6 space-y-2">
          <p class="text-sm">ليس لديك حساب؟
            <a href="../signup.html" class="text-[--primary] hover:underline">إنشاء حساب</a>
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="../../js/auth/login.js"></script>
    <script type="module" src="../../js/script.js"></script>
  </body>
</html>
